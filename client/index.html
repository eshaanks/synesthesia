<!DOCTYPE html>
<html>
<head>
  <title>Synesthesia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="bg-blur">
    <canvas id="bgCanvas"></canvas>
  </div>

  <div id="app">
    <div id="display">
      <canvas id="glCanvas" width="900" height="560"></canvas>
    </div>

    <div id="visualizers">
      <div class="viz-panel">
        <canvas id="micCanvas" width="440" height="60"></canvas>
        <div class="viz-label">mic input</div>
      </div>
      <div class="viz-divider"></div>
      <div class="viz-panel">
        <canvas id="playbackCanvas" width="440" height="60"></canvas>
        <div class="viz-label">image memory</div>
      </div>
    </div>

    <div id="hud">
      <div id="info">—</div>
      <div id="score">—</div>
    </div>

    <button id="btn" onclick="toggleMic()">start mic</button>
    <div id="log">waiting...</div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/mic.js"></script>

</body>
</html>
